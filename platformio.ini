  -D RI_LAYERS=3
  -D RI_WEIGHTS_SHA256=\"a1a4dcd001bfb86323c66e3db79ce15bbab317c68e23dfc8447f82eddbd560ca\"
  -D RI_MODEL_PROFILE=\"multisensor_h320_all_int8\"
  -D RI_MODEL_PARAMS=2486433
  -D RI_COMPRESSED_BYTES=2510720

