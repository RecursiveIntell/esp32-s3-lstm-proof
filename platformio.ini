[platformio]
default_envs = esp32s3_lstm

[env:esp32s3_lstm]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
monitor_speed = 115200
board_build.partitions = partitions.csv
extra_scripts = extra_script.py
build_flags =
  -D CORE_DEBUG_LEVEL=0
  -O3
  -D CONFIG_NN_OPTIMIZED
  -D CONFIG_IDF_TARGET_ESP32S3
  -D ARCH_ESP32_S3=1
  -I lib/esp-nn/include
  -I lib/esp-nn/src/common
  -mlongcalls
build_unflags = -Os
lib_ldf_mode = deep+
monitor_filters = esp32_exception_decoder

# Offline-first, single-board sentinel.  The model artifact must be written to
# the existing `weights` partition separately; firmware upload does not overwrite
# the model partition.
#
# H256 multi-sensor performance profile: 1.6M params, ~40 chars/s, int4+SIMD
[env:esp32s3_final_sentinel_h256]
extends = env:esp32s3_lstm
build_flags =
  ${env:esp32s3_lstm.build_flags}
  -D RI_FINAL_SENTINEL=1
  -D RI_FIRMWARE_VARIANT=\"final_sentinel_h256_ms\"
  -D RI_HIDDEN=256
  -D RI_LAYERS=3
  -D RI_WEIGHTS_SHA256=\"d8763148d6562d5d5987403876f746988c2636552cb10d77cd5bfaba5a62e707\"
  -D RI_MODEL_PROFILE=\"multisensor_h256_all_int8\"
  -D RI_MODEL_PARAMS=1595937
  -D RI_COMPRESSED_BYTES=1615488

# H320 multi-sensor accuracy profile: 2.5M params, ~17 chars/s, all canonical outputs matched
[env:esp32s3_final_sentinel_h320]
extends = env:esp32s3_lstm
build_flags =
  ${env:esp32s3_lstm.build_flags}
  -D RI_FINAL_SENTINEL=1
  -D RI_FIRMWARE_VARIANT=\"final_sentinel_h320_ms\"
